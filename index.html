<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRDI External Fund — ระบบรับคำขอออกใบเสร็จรับเงิน งบประมาณวิจัยจากแหล่งทุนภายนอก</title>
<meta name="description" content="ยื่นคำขอออกใบเสร็จรับเงินสำหรับงบประมาณวิจัยจากแหล่งทุนภายนอก และติดตามสถานะทุกขั้นตอน — สถาบันวิจัยและพัฒนาชายแดนภาคใต้ มหาวิทยาลัยราชภัฏยะลา">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="index,follow">

<!-- ไอคอนและรูปแบ่งปัน (ไฟล์อยู่ในโฟลเดอร์ assets/ ที่คัดมาทั้งชุด) -->
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta property="og:title" content="SRDI External Fund — ระบบรับคำขอออกใบเสร็จรับเงิน (สวพ.ชต. มรย.)">
<meta property="og:description" content="ยื่นคำขอออกใบเสร็จรับเงินสำหรับงบประมาณวิจัยจากแหล่งทุนภายนอก และติดตามสถานะทุกขั้นตอน">
<meta property="og:image" content="assets/og-image.png">
<meta property="og:type" content="website">

<!-- ฟอนต์ธีม STAR: Prompt (หัวข้อ/ปุ่ม/ตัวเลข) + Anuphan (เนื้อความ) — ล็อกตามมติ SM-D26 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ★ ชุด B (มติ EF-D69): กล่องเดียวที่ค้างบนจอ = แถบเตือน 2 ชั้น + แถบบน
     เดิม .topbar เป็น sticky ตัวเดียว แถบเตือนจึงเลื่อนหายไปตั้งแต่ 39px แรก
     ทำให้ข้อความ "เชื่อมต่อระบบไม่ได้" หลุดสายตา แล้วผู้ใช้กรอกฟอร์มจนจบฟรี ๆ
     🔴 ห้ามใส่ position:sticky กลับเข้า .topbar อีก — sticky ซ้อน sticky แล้วเพี้ยน -->
<div id="stickyTop">

  <!-- แถบเตือนระดับหน้า: ยังไม่ตั้ง API_URL / เชื่อมต่อหลังบ้านไม่ได้ -->
  <div id="appBanner" class="app-banner" style="display:none" role="alert"></div>

  <!-- แถบเตือน "โหมดทดสอบ" — ขึ้นเองเมื่อ config.test_mode = true (มติ EF-D27) -->
  <div id="testBanner" class="app-banner" style="display:none" role="status"></div>

  <!-- แถบบน: โลโก้จริง + ชื่อระบบ (เติมจาก config) + เมนู (เติมจาก JS) -->
  <header class="topbar" id="topbar">
    <div class="wrap">
      <button class="brand" id="brand" data-page="home" aria-label="ไปหน้าหลัก">
        <img class="logo-img" src="assets/srdi_logo.png" alt="โลโก้ สถาบันวิจัยและพัฒนาชายแดนภาคใต้ มหาวิทยาลัยราชภัฏยะลา">
        <span class="btxt"><b id="brandTitle">SRDI External Fund</b><span id="brandSub">งบประมาณวิจัยจากแหล่งทุนภายนอก · สวพ.ชต. มรย.</span></span>
      </button>
      <div class="spacer"></div>
      <nav class="tabs" id="tabs" aria-label="เมนูหลัก"></nav>
    </div>
  </header>

</div><!-- /#stickyTop -->

<!-- แถบผู้ใช้: บอกสถานะการยืนยันอีเมลของผู้ขอรับบริการ -->
<div class="userbar" id="userbar"><div class="wrap">
  <div class="who" id="who"></div>
  <!-- ★ มติ EF-D78: ของฝั่งขวารวมเป็นกลุ่มเดียว เพราะ .userbar .wrap เป็น space-between
       ถ้าปล่อยเป็น 3 ลูกตรง ๆ ปุ่มกลางจะไปกองกลางแถว · ใช้ inline flex แบบเดียวกับที่ไฟล์นี้ใช้อยู่
       จึง **ไม่ต้องแก้ styles.css เลย**
       ★ มติ EF-D81 (EF-S20 · ชุด E): เติม flex-wrap:wrap + justify-content:flex-end
         🔴 เหตุผล: กลุ่มนี้เพิ่มจาก 2 ชิ้นเป็น 3 ชิ้น · วัดบนจอ 375px แล้วรวมกันกว้างเกินที่ว่างจริง
            ถ้าไม่ให้ตกบรรทัด ปุ่มสุดท้ายจะล้นออกนอกแถบ (ตระกูลเดียวกับกับดักข้อ 43)
            wrap ทำให้ตกลงมาเป็นบรรทัดที่สองแทน ซึ่งอ่านออกและกดได้ครบ -->
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end">
    <!-- ปุ่มสลับโหมดสว่าง/มืด — ย้ายมาจากแถวแท็บ (เดิมทำให้แถบเมนูของ admin ตก 2 บรรทัด) -->
    <span id="modeSlot"></span>
    <button class="linkbtn" id="feedbackLink" data-act="feedback">💬 แจ้งปัญหา/ข้อเสนอแนะ</button>
    <!-- ★ EF-S20 (มติ EF-D81): ทางเข้าของเจ้าหน้าที่ — คุณสุ่ยขอย้ายมาจากท้ายเว็บเอง 2 ส.ค. 2569
         ★ "ย้าย" ไม่ใช่ "เพิ่มที่ที่สอง" — ท้ายเว็บไม่มีปุ่มนี้แล้ว (ของ 2 ชุดจะเพี้ยนจากกันภายหลัง · EF-D63)
         ★ ถ้อยคำบนปุ่มและ id เดิมทุกตัวอักษร (EF-D5) — ย้ายที่ได้ ห้ามเปลี่ยนชื่อ ห้ามลบ -->
    <button class="linkbtn" data-page="staff" id="staffLink">🔐 สำหรับเจ้าหน้าที่</button>
  </div>
</div></div>

<!-- เนื้อหาหลัก (JS render ตามหน้า) -->
<main><div class="wrap" id="stage" aria-live="polite"></div></main>

<footer class="foot" id="foot"><div class="wrap">
  SRDI External Fund 2.0 · สถาบันวิจัยและพัฒนาชายแดนภาคใต้ มหาวิทยาลัยราชภัฏยะลา<br>
  <!-- ★ EF-S3 (มติ EF-D93): มาตรฐานที่ระบบนี้อ้างอิงได้จริง 3 ตัว
       · WCAG 2.2 = ป้ายกำกับช่องครบ · คู่สีผ่านเกณฑ์ · ใช้คีย์บอร์ดได้ทั้งหน้า
       · ITIL 4   = ลำดับสถานะของงานบริการ · เตือนงานค้างตามรอบ · ร่องรอยการเปลี่ยนสถานะทุกครั้ง
       · PDPA     = ปุ่มปรับสิทธิ์ไฟล์ย้อนหลัง · ปิดบังอีเมลในร่องรอย · เก็บรหัส OTP เป็นค่าที่ย้อนกลับไม่ได้
       ❌ ไม่อ้าง ISO 10002 — เป็นมาตรฐานระบบจัดการข้อร้องเรียน ซึ่งระบบนี้ไม่ใช่ (แปะแล้วอ้างไม่ได้จริง) -->
  <span id="footContact">โทรภายใน 31004 · Kantakan.u@yru.ac.th</span> · อิงมาตรฐาน WCAG 2.2 · ITIL 4 · PDPA
  <!-- ★ EF-S4 (มติ EF-D94 · EF-D95): ทางเข้าหน้าสถิติสาธารณะอยู่ที่นี่ที่เดียว
       🔴 ห้ามย้ายไปแถบแท็บ #tabs — แถบนั้นอยู่ใน #stickyTop ค้างบนจอทุกหน้า
          ความสูงของมันคือราคาที่จ่ายตลอดเวลา (กับดักข้อ 43) และแถบของ admin มี 7 แท็บอยู่แล้ว
          มติ EF-D78 เคยต้องย้ายปุ่มโหมดสีออกเพราะชิ้นที่ 8 ทำให้ตกเป็น 2 บรรทัด
       ★ ตั้งต้นซ่อนไว้ · JS เปิดให้เองเมื่อ config.public_stats_enabled = true -->
  <br><button class="linkbtn" data-page="stats" id="statsLink" style="display:none">📊 สถิติการให้บริการ</button>
  <!-- ★ EF-S20 (มติ EF-D81): ปุ่ม "🔐 สำหรับเจ้าหน้าที่" ย้ายขึ้นไปอยู่บนแถบผู้ใช้แล้ว
       (เดิมอยู่ตรงนี้ตั้งแต่เฟส 3) — ห้ามใส่กลับมาที่นี่คู่กัน จะกลายเป็นปุ่มเดียวกัน 2 ที่ -->
</div></footer>

<!-- modal กลาง (ยืนยันการบันทึก · แบบประเมิน · กู้รหัส · กล่องแจ้งปัญหา) -->
<div class="overlay" id="ov"><div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="กล่องโต้ตอบ"></div></div>

<script src="app.js" defer></script>
</body>
</html>
